{% extends "base.html" %}
{% block content %}
<h2>Регистрация пациента</h2>
<form method="post">
    <label>Логин: <input type="text" name="username" required></label><br>
    <label>Пароль: <input type="password" name="password" required></label><br>
    <label>ФИО: <input type="text" name="full_name" required></label><br>
    <label>Телефон: <input type="text" name="phone" required></label><br>
    <label>Email: <input type="email" name="email" required></label><br>
    <label>Полис ОМС: <input type="text" name="policy" required></label><br>
    <button type="submit">Зарегистрироваться</button>
</form>
{% endblock %}
